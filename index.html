<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biome Grid Renderer</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  canvas { border: 1px solid #000; display: block; margin-top: 10px; }
</style>
</head>
<body>

<h2>Biome Grid Renderer</h2>

<input type="file" id="fileInput" accept=".save">
<label for="scale">Scale Factor:</label>
<input type="number" id="scale" value="4" min="1" style="width:50px;">
<button id="renderBtn">Render PNG</button>
<button id="downloadBtn" disabled>Download PNG</button>

<canvas id="mapCanvas"></canvas>

<script>
const biomeColors = {
  0: [245, 196, 110],
  1: [204, 174, 77],
  2: [66, 135, 40],
  3: [184, 179, 82],
  4: [119, 155, 70],
  5: [70, 128, 70],
  6: [59, 108, 79],
  7: [70, 128, 70],
  8: [131, 160, 131],
  9: [245, 245, 255],
  10: [15, 55, 100],
  11: [39, 75, 116],
  12: [75, 0, 110]  // modifier
};

const loopWidth = 256;

let grid = [];
let canvas = document.getElementById('mapCanvas');
let ctx = canvas.getContext('2d');
let imageRendered = false;

function parseSaveFile(text) {
  text = text.trim();
  if (text.startsWith("[") && text.endsWith("]")) text = text.slice(1, -1);
  text = [...text].filter(c => c >= ' ' && c <= '~').join('');

  const regex = /\[(\d+\.?\d*),\s*(\d+\.?\d*)\]|(\d+\.?\d*)/g;
  let match, tiles = [];
  while ((match = regex.exec(text)) !== null) {
    if (match[1] !== undefined) {
      tiles.push([parseInt(parseFloat(match[1])), parseInt(parseFloat(match[2]))]);
    } else {
      tiles.push([parseInt(parseFloat(match[3])), null]);
    }
  }
  return tiles;
}

function buildGrid(tiles) {
  const height = Math.ceil(tiles.length / loopWidth);
  const width = loopWidth;
  let g = Array.from({length: height}, () => Array.from({length: width}, () => [0, null]));
  for (let i = 0; i < tiles.length; i++) {
    const x = Math.floor(i / height);
    const y = i % height;
    if (x < width && y < height) g[y][x] = tiles[i];
  }
  return g;
}

function renderGrid(grid, scale) {
  const height = grid.length;
  const width = grid[0].length;
  canvas.width = width * scale;
  canvas.height = height * scale;

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      let [biome, mod] = grid[y][x];
      let color = biomeColors[biome] || [100,100,100];
      if (mod === 12) { // Dreadlands overlay
        color = [
          Math.floor(color[0]*0.5 + 90*0.5),
          Math.floor(color[1]*0.5 + 0),
          Math.floor(color[2]*0.5 + 120*0.5)
        ];
      }
      ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
      ctx.fillRect(x*scale, y*scale, scale, scale);
    }
  }
}

document.getElementById('renderBtn').addEventListener('click', () => {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("Select a .save file first.");
  const scale = parseInt(document.getElementById('scale').value) || 4;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const tiles = parseSaveFile(text);
    grid = buildGrid(tiles);
    renderGrid(grid, scale);
    imageRendered = true;
    document.getElementById('downloadBtn').disabled = false;
  }
  reader.readAsText(fileInput.files[0]);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!imageRendered) return;
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = 'biomeGrid.png';
  link.click();
});
</script>

</body>
</html>
